onboarding = false

[ui]
show_agent_labels_on_pane_borders = true
host_cursor = "native"
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+f"

navigate_workspace_up = "k"
navigate_workspace_down = "j"
next_workspace = ["ctrl+shift+j", "prefix+j"]
previous_workspace = ["ctrl+shift+k", "prefix+k"]
switch_workspace = "prefix+shift+1..9"

new_tab = "prefix+t"
previous_tab = ["ctrl+shift+h", "prefix+h"]
next_tab = ["ctrl+shift+l", "prefix+l"]
move_tab_previous = "prefix+shift+h"
move_tab_next = "prefix+shift+l"

copy_mode = "prefix+c"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

split_vertical = "prefix+p"
split_horizontal = "prefix+d"

# herdr-plus config
# install: herdr plugin install cloudmanic/herdr-plus
[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

